<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv='X-UA-Compatible' content='IE=edge' />
    <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
    <title>cgl28 Example-SMART-App</title>

    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <!--
      Temporarily disable cerner-smart-embeddable-lib
      <link rel='stylesheet' type='text/css' href='./lib/css/cerner-smart-embeddable-lib-1.0.0.min.css'>
    -->
  </head>
  <body>
    <div id='errors'></div>

    <div id="loading" class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>

    <div id='holder'>
      <h2>Example-SMART-App</h2>

      <h2>Patient Resource</h2>
      <table>
        <tr><th>First Name:</th><td id='fname'></td></tr>
        <tr><th>Last Name:</th><td id='lname'></td></tr>
        <tr><th>Gender:</th><td id='gender'></td></tr>
        <tr><th>Date of Birth:</th><td id='birthdate'></td></tr>
      </table>

      <h2>Observation Resource</h2>
      <table>
        <tr><th>Height:</th><td id='height'></td></tr>
        <tr><th>Systolic Blood Pressure:</th><td id='systolicbp'></td></tr>
        <tr><th>Diastolic Blood Pressure:</th><td id='diastolicbp'></td></tr>
        <tr><th>LDL:</th><td id='ldl'></td></tr>
        <tr><th>HDL:</th><td id='hdl'></td></tr>
      </table>
    </div>

    <!-- Load SMART client library first -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.min.js"></script>

    <!-- Cerner-specific session protection -->
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>

    <!-- Your app logic -->
    <script src='./src/js/example-smart-app.js'></script>

    <!-- jQuery for DOM manipulation -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
  </body>
</html>
