<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <title>Example-SMART-App</title>
  </head>
  <body>
    <!-- Load latest SMART client -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.min.js"></script>

    <!-- Cerner session protection -->
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>

    <!-- Launch SMART flow -->
    <script>
      FHIR.oauth2.authorize({
        clientId: '79f2db37-c184-4ed3-8108-1497835f08bf',
        scope: 'launch openid profile fhirUser patient/Patient.read patient/Observation.read Patient.read Observation.read',
        redirectUri: 'https://cgl28.github.io/smart-on-fhir-tutorial/example-smart-app/'
      });
    </script>

    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
