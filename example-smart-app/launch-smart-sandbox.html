<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <link rel='stylesheet' type='text/css' href='./src/css/example-smart-app.css'>
    <title>Example-SMART-App</title>
  </head>
  <body>
    <!-- Load latest SMART client library -->
    <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.min.js"></script>

    <!-- Cerner-specific session protection -->
    <script src='./lib/js/fhir-client-cerner-additions-1.0.0.js'></script>

    <!-- Launch SMART flow using modern syntax -->
    <script>
      FHIR.oauth2.authorize({
        clientId: 'c74f88a1-2433-405e-b732-50bd9b2a1f90',
        scope: 'patient/Patient.read patient/Observation.read launch online_access openid profile',
        redirectUri: 'https://cgl28.github.io/smart-on-fhir-tutorial/example-smart-app/'
      });
    </script>

    <div class="spinner">
      <div class="bounce1"></div>
      <div class="bounce2"></div>
      <div class="bounce3"></div>
    </div>
  </body>
</html>
